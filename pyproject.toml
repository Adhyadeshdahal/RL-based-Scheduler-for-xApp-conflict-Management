[project]
name = "cdd-oran"
version = "0.1.0"
description = "Causal Discovery-Driven Model-Based Planning for xApp Conflict Mitigation in O-RAN"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.10.0",
    "numpy>=2.0",
    "gymnasium>=1.2.3",
    "networkx>=3.3",
    "matplotlib>=3.9",
    "tensorboard>=2.18",
    "pyyaml>=6.0.3",
]

[tool.uv]
# Not yet an installable distribution; imports resolve from the working directory.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.9",
    "ty>=0.0.65",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # line length -- the formatter owns this
]

[tool.ty.environment]
python-version = "3.12"
